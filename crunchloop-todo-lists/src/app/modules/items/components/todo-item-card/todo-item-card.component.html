<div class="col-12 border" [ngClass]="item.isCompleted ? 'completed' : 'pending'" *ngIf="item">
    <div class="row w-100 mx-0 py-3">
        <div class="form">
            <div class="row">
                <div class="col-6">
                    <p><b>ID:</b> {{ item.id }}</p>
                </div>
    
                <div class="col-6 text-end">
                    <button class="btn btn-sm btn-danger text-end" (click)="onDeleteEvent()">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>


            <div class="form-group">
                <input type="checkbox" name="is-completed" id="is-completed" [(ngModel)]="item.isCompleted" (ngModelChange)="onCompletionStatusChangeEvent()" />
                <label for="is-completed" class="mx-1">Completed</label>
            </div>

            <hr />

            <div class="form-group col-12">
                <label for="list-name">Name</label> <br />
                <input name="list-name" type="text" class="form-control" [(ngModel)]="item.name" (ngModelChange)="onNameChangeEvent()">
            </div>
        </div>
    </div>
</div>
