<div class="row w-100 mx-0 border p-1">
    <div class="col-12">
        <h3>List creation</h3>
        <form>
            <label for="list-name">Name</label> <br />
            <input name="list-name" type="text" class="form-control w-50" [(ngModel)]="name">
        </form>
    </div>

    <div class="col-12 text-end">
        <button class="btn btn-primary mx-auto" (click)="onCreateListClick()">Create</button>
    </div>
</div>
